name: Build website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web application
        run: ./gradlew --no-daemon --max-workers=2 :composeApp:wasmJsBrowserProductionWebpack

      - name: Locate generated web files
        run: |
          echo "=== index.html ==="
          find composeApp/build -type f -name 'index.html'
          echo "=== JavaScript ==="
          find composeApp/build -type f -name 'composeApp.js'
          echo "=== WASM ==="
          find composeApp/build -type f -name '*.wasm'

      - name: Upload website files
        uses: actions/upload-artifact@v4
        with:
          name: recipes-website
          path: composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: warn
